server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: gateway

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        web flux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

            - id: notification-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2


            - id: transaction-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/transaction/**
              filters:
                - StripPrefix=2

            - id: wallet-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/wallet/**
              filters:
                - StripPrefix=2

