server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: gateway

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        web flux:
          routes:

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=2

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notification/**
              filters:
                - StripPrefix=2

            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/api/transaction/**
              filters:
                - StripPrefix=2

            - id: wallet-service
              uri: lb://WALLET-SERVICE
              predicates:
                - Path=/api/wallet/**
              filters:
                - StripPrefix=2